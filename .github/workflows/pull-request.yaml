name: pull-request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Staging

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Icod.DirTree.sln
      - name: Build
        run: dotnet build Icod.DirTree.sln -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test Icod.DirTree.sln -c ${{ env.CONFIGURATION }} --no-build --no-restore --logger trx

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Icod.DirTree.csproj
      - name: Build
        run: dotnet build Icod.DirTree.csproj -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true
      - name: Pack one tool package
        run: dotnet pack Icod.DirTree.csproj -c ${{ env.CONFIGURATION }} --no-build --no-restore -o artifacts/package -p:ContinuousIntegrationBuild=true
      - name: Verify package contents
        shell: pwsh
        run: ./packaging/VerifyPackageArtifact.ps1 -ArtifactDirectory artifacts/package -Configuration '${{ env.CONFIGURATION }}'
      - uses: actions/upload-artifact@v4
        with:
          name: dirtree-package
          path: artifacts/package/*.nupkg
          if-no-files-found: error
          retention-days: 7

  package-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: dirtree-package
          path: artifacts/package
      - name: Install and run packed tool
        shell: pwsh
        run: ./packaging/TestPackedTool.ps1 -ArtifactDirectory artifacts/package -Configuration '${{ env.CONFIGURATION }}'
